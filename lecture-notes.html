<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lecture Notes · AppSec Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --canvas:#000;--card:#0a0a0c;--elev:#101012;--deep:#06060a;
  --hair:rgba(255,255,255,.06);--hair2:rgba(255,255,255,.14);--hair3:rgba(255,255,255,.22);
  --ink:#fcfdff;--body:rgba(252,253,255,.86);--char:rgba(252,253,255,.7);--mute:#a1a4a5;--ash:#888e90;--stone:#464a4d;
  --blue:#3b9eff;--green:#11ff99;--orange:#ff801f;--yellow:#ffc53d;--red:#ff2047;--purple:#7b3ff2;
  --serif:"Instrument Serif","Tiempos Headline",Georgia,serif;
  --sans:"Geist","Inter Tight","Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"Geist Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01","ss03"}
::selection{background:var(--ink);color:#000}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;
  padding:0 24px;height:60px;background:rgba(0,0,0,.72);backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--hair)}
.bar .home{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.bar .home .mk{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#000;display:grid;place-items:center;
  font-family:var(--serif);font-style:italic;font-size:15px;line-height:1}
.bar .home:hover{text-decoration:none;opacity:.85}
.bar .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.bar .tab{font-size:12.5px;font-weight:500;color:var(--char);padding:6px 12px;border-radius:999px;
  border:1px solid var(--hair2);background:transparent;transition:all .15s}
.bar .tab:hover{color:var(--ink);border-color:var(--hair3);text-decoration:none}
.bar .tab.active{color:#000;background:var(--ink);border-color:var(--ink)}
@media(max-width:640px){.bar{height:auto;padding:10px 14px;flex-wrap:wrap}.bar .tabs{margin-left:0;width:100%}}

/* doc heading band */
.band{max-width:820px;margin:0 auto;padding:56px 24px 8px}
.band .ey{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
.band h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(40px,7vw,68px);line-height:1;
  letter-spacing:-.01em;margin:0;color:var(--ink);font-feature-settings:"ss01","liga"}
.band .sub{font-size:15px;color:var(--char);margin-top:12px}

/* article */
.doc{max-width:820px;margin:0 auto;padding:24px 24px 120px}
.doc h1{display:none} /* the md's own H1 — hidden, we show .band heading instead */
.doc h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;line-height:1.08;
  letter-spacing:-.01em;color:var(--ink);margin:52px 0 14px;padding-top:18px;border-top:1px solid var(--hair);
  font-feature-settings:"ss01","liga"}
.doc h2:first-of-type{border-top:0;padding-top:0;margin-top:24px}
.doc h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:25px;line-height:1.12;
  letter-spacing:-.01em;color:var(--ink);margin:34px 0 10px;font-feature-settings:"ss01","liga"}
.doc h4{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute);margin:26px 0 8px}
.doc p{color:var(--body);margin:0 0 14px}
.doc strong{color:var(--ink);font-weight:600}
.doc em{color:var(--ink)}
.doc a{color:var(--blue)}
.doc hr{border:0;border-top:1px solid var(--hair);margin:36px 0}
.doc ul,.doc ol{padding-left:22px;margin:0 0 16px;color:var(--body)}
.doc li{margin-bottom:6px}
.doc li::marker{color:var(--stone)}
.doc blockquote{margin:18px 0;padding:14px 18px;border-left:3px solid var(--orange);
  background:var(--card);border-radius:0 8px 8px 0;color:var(--char)}
.doc blockquote p{margin:0 0 8px}.doc blockquote p:last-child{margin:0}

/* inline + block code */
.doc code{font-family:var(--mono);font-size:.86em;background:var(--card);color:var(--ink);
  padding:1.5px 6px;border-radius:4px;border:1px solid var(--hair2)}
.doc pre{background:var(--deep);border:1px solid var(--hair2);border-radius:10px;
  padding:16px 18px;overflow-x:auto;margin:14px 0 20px;-webkit-overflow-scrolling:touch}
.doc pre code{background:none;border:0;padding:0;font-size:12.5px;line-height:1.65;color:var(--body)}
.doc pre::-webkit-scrollbar{height:6px}.doc pre::-webkit-scrollbar-thumb{background:var(--hair2);border-radius:3px}

/* tables */
.doc table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--hair2);
  border-radius:10px;overflow:hidden;margin:16px 0 24px;font-size:13.5px;background:var(--card);display:block;overflow-x:auto}
.doc thead th{background:var(--elev);font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--hair2);white-space:nowrap}
.doc tbody td{padding:10px 14px;border-bottom:1px solid var(--hair);color:var(--body);vertical-align:top;line-height:1.5}
.doc tbody tr:last-child td{border-bottom:0}
.doc tbody td:first-child{color:var(--ink);font-weight:500}

/* back to top */
.totop{position:fixed;bottom:22px;right:22px;z-index:30;width:42px;height:42px;border-radius:999px;
  display:grid;place-items:center;background:var(--ink);color:#000;font-size:18px;border:0;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .2s;text-decoration:none}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{text-decoration:none}
</style>
</head>
<body>
<header class="bar">
  <a class="home" href="index.html"><span class="mk">A</span>AppSec Notes</a>
  <nav class="tabs"><a href="lecture-notes.html" class="tab active">Lecture Notes</a><a href="detailed-notes.html" class="tab">Detailed Notes</a><a href="portswigger-notes.html" class="tab">PortSwigger Notes</a></nav>
</header>

<div class="band">
  <div class="ey">— Notes preview</div>
  <h2>Lecture Notes</h2>
  <div class="sub">SST · 7 sessions + assignment + flashcards</div>
</div>

<article class="doc" id="doc">
<p style="color:var(--mute)">Loading notes…</p>
</article>

<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script>
(async () => {
  const doc = document.getElementById('doc');
  try {
    const res = await fetch('SST-AppSec-Simplified-Notes.md');
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    doc.innerHTML = marked.parse(await res.text(), { headerIds: true, mangle: false });
    if (location.hash) {
      const id = decodeURIComponent(location.hash.slice(1));
      const el = document.getElementById(id) || document.getElementsByName(id)[0];
      if (el) el.scrollIntoView();
    }
  } catch (e) {
    doc.innerHTML = '<blockquote><p>Could not load <code>SST-AppSec-Simplified-Notes.md</code> (' + e.message +
      '). If you opened this page directly from disk, serve the folder over HTTP instead, e.g. <code>python3 -m http.server</code>.</p></blockquote>';
  }
})();
</script>

<a class="totop" id="totop" href="#" aria-label="Back to top">↑</a>
<script>
const t=document.getElementById('totop');
addEventListener('scroll',()=>{t.classList.toggle('show',scrollY>600)});
t.addEventListener('click',e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'})});
</script>
</body>
</html>
